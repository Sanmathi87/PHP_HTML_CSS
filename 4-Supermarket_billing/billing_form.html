<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supermarket Billing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h1>Supermarket Billing System</h1>

        <form action="generate_invoice.php" method="POST">
            <label>Customer Name *</label>
            <input type="text" name="customer_name" required>

            <table id="productTable">
                <tr>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Price (₹)</th>
                </tr>
                <tr>
                    <td><input type="text" name="product_name[]" required></td>
                    <td><input type="number" name="quantity[]" min="1" required></td>
                    <td><input type="number" name="price[]" min="0" step="0.01" required></td>
                </tr>
                <tr>
                    <td><input type="text" name="product_name[]"></td>
                    <td><input type="number" name="quantity[]" min="1"></td>
                    <td><input type="number" name="price[]" min="0" step="0.01"></td>
                </tr>
                <tr>
                    <td><input type="text" name="product_name[]"></td>
                    <td><input type="number" name="quantity[]" min="1"></td>
                    <td><input type="number" name="price[]" min="0" step="0.01"></td>
                </tr>
            </table>

            <label>Discount (%)</label>
            <input type="number" name="discount" min="0" max="100" value="0" step="0.1">

            <label>Tax / GST (%)</label>
            <input type="number" name="tax" min="0" max="100" value="5" step="0.1">

            <button type="submit">Generate Invoice</button>
        </form>
    </div>

</body>
</html>
