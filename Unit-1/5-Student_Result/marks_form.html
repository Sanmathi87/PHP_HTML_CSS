<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Result Processing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h1>Student Result Processing System</h1>

        <form action="process_result.php" method="POST">
            <label>Student Name *</label>
            <input type="text" name="student_name" required>

            <label>Subject 1 - Tamil</label>
            <input type="number" name="marks1" min="0" max="100" required>

            <label>Subject 2 - English</label>
            <input type="number" name="marks2" min="0" max="100" required>

            <label>Subject 3 - Mathematics</label>
            <input type="number" name="marks3" min="0" max="100" required>

            <label>Subject 4 - Science</label>
            <input type="number" name="marks4" min="0" max="100" required>

            <label>Subject 5 - Social Science</label>
            <input type="number" name="marks5" min="0" max="100" required>

            <button type="submit">Process Result</button>
        </form>
    </div>

</body>
</html>
