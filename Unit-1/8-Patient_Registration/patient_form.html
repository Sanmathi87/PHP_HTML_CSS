<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h1>Patient Registration System</h1>

        <?php if (isset($_GET['error'])): ?>
            <p class="error"><?php echo htmlspecialchars($_GET['error']); ?></p>
        <?php endif; ?>

        <form action="process_patient.php" method="POST">
            <label>Full Name *</label>
            <input type="text" name="fullname" value="<?php echo isset($_GET['fullname']) ? htmlspecialchars($_GET['fullname']) : ''; ?>" required>

            <label>Age *</label>
            <input type="number" name="age" min="0" max="120" required>

            <label>Gender *</label>
            <select name="gender" required>
                <option value="">-- Select --</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label>Phone Number *</label>
            <input type="text" name="phone" required>

            <label>Email</label>
            <input type="email" name="email">

            <label>Address</label>
            <textarea name="address" rows="3"></textarea>

            <label>Blood Group</label>
            <select name="blood_group">
                <option value="">-- Select --</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <label>Reason for Visit *</label>
            <input type="text" name="reason" required>

            <label>Preferred Doctor / Department *</label>
            <select name="department" required>
                <option value="">-- Select --</option>
                <option value="General Medicine">General Medicine</option>
                <option value="Cardiology">Cardiology</option>
                <option value="Orthopedics">Orthopedics</option>
                <option value="Pediatrics">Pediatrics</option>
                <option value="Dermatology">Dermatology</option>
            </select>

            <button type="submit">Register Patient</button>
        </form>
    </div>

</body>
</html>
